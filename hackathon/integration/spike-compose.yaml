# Opus P1 engine spike — isolated, disposable PostgreSQL 18 + pg_trickle.
# Data lives on tmpfs: `docker compose down` destroys it. Never point this at shared data.
# Usage: docker compose -f hackathon/integration/spike-compose.yaml -p ax-opus-spike up -d
name: ax-opus-spike
services:
  pg:
    # pg_trickle 0.108.3 on PostgreSQL 18.6 (arm64 digest recorded in ENGINE_CONTRACT).
    image: ghcr.io/trickle-labs/pg_trickle:latest
    environment:
      POSTGRES_PASSWORD: spike-only-not-secret
      POSTGRES_DB: tenant_shared
    ports:
      - "127.0.0.1:25540:5432"
    tmpfs:
      - /var/lib/postgresql/18/docker:size=1500m
    shm_size: 256m
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
