# AgrregateX P3 sharded demo: two INDEPENDENT PostgreSQL + pg_trickle shards, tenant router API.
#   cd hackathon && docker compose -f compose.sharded.yaml up -d --build   ->  http://127.0.0.1:8091
# Isolated project, ports, networks and volumes: does not touch the single-DB compose.yaml stack.
# Partition demo: sharding/partition_demo.sh (detaches the API/writer from net_a only).
# Credentials are LOCAL DEMO DEFAULTS; override via environment for anything shared.
name: aggregatex-sharded

x-roles: &roles
  AX_API_PASSWORD: ${AX_API_PASSWORD:-local-demo-api}
  AX_WRITER_PASSWORD: ${AX_WRITER_PASSWORD:-local-demo-writer}
  AX_MONITOR_PASSWORD: ${AX_MONITOR_PASSWORD:-local-demo-monitor}

x-shard: &shard
  # Digest-pinned multi-arch OCI index (PG 18.6-1.pgdg12+2, pg_trickle 0.108.3; built 2026-10-06).
  # Children (verified against the ghcr.io manifest + config labels on 2026-10-31; RUNTIME verified on arm64 only):
  #   linux/arm64 sha256:e3490ecc54beae8061b3001d83888a49b708c0aa78ecdfe02e1687966d51f309
  #   linux/amd64 sha256:92f271e27f8d3b9b5aaf568df10ee377937f48d79825e73adaf469768b0208a5
  # To pin one platform explicitly: AX_PG_TRICKLE_IMAGE=ghcr.io/trickle-labs/pg_trickle@<child digest>.
  # Never float to :latest.
  image: ${AX_PG_TRICKLE_IMAGE:-ghcr.io/trickle-labs/pg_trickle@sha256:94344bb98995b19c826f939739672481abaab8c25710e3910b48bdb7cf5b3b8d}
  # Small footprint: the host is memory constrained (see docs/handoffs/opus-sharding.md).
  command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=8MB",
            "-c", "maintenance_work_mem=32MB", "-c", "effective_cache_size=256MB"]
  mem_limit: 512m
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d aggregatex && psql -U postgres -d aggregatex -tAc \"select 1 from pg_roles where rolname='ax_monitor'\" | grep -q 1"]
    interval: 3s
    retries: 60

services:
  shard_a:
    <<: *shard
    environment:
      <<: *roles
      POSTGRES_PASSWORD: ${AX_DB_SUPERUSER_PASSWORD:-local-demo-superuser}
      POSTGRES_DB: aggregatex
      AX_SHARD_TENANTS: "{1,3,4}"          # must match sharding/directory.v1.json
      AX_SEED_ORDERS: ${AX_SEED_ORDERS:-10000}   # GLOBAL order count, not per shard
      AX_SEED_TENANTS: 10
      AX_SHARD_SEQ_START: 100000000
    volumes:
      - ./sql:/ax/sql:ro
      - ./sharding/seed_shard.sql:/ax/seed_shard.sql:ro
      - ./app/db/init.sh:/docker-entrypoint-initdb.d/10-aggregatex.sh:ro
      - shard_a_data:/var/lib/postgresql
    ports: ["127.0.0.1:${AX_SHARD_A_PORT:-25571}:5432"]
    networks: [net_a]

  shard_b:
    <<: *shard
    environment:
      <<: *roles
      POSTGRES_PASSWORD: ${AX_DB_SUPERUSER_PASSWORD:-local-demo-superuser}
      POSTGRES_DB: aggregatex
      AX_SHARD_TENANTS: "{2,5,6,7,8,9,10}"
      AX_SEED_ORDERS: ${AX_SEED_ORDERS:-10000}
      AX_SEED_TENANTS: 10
      AX_SHARD_SEQ_START: 200000000
    volumes:
      - ./sql:/ax/sql:ro
      - ./sharding/seed_shard.sql:/ax/seed_shard.sql:ro
      - ./app/db/init.sh:/docker-entrypoint-initdb.d/10-aggregatex.sh:ro
      - shard_b_data:/var/lib/postgresql
    ports: ["127.0.0.1:${AX_SHARD_B_PORT:-25572}:5432"]
    networks: [net_b]

  api:
    build: { context: ., dockerfile: app/Dockerfile }
    image: aggregatex-sharded:local
    environment: &apienv
      <<: *roles
      AX_DB_NAME: aggregatex
      AX_SHARDS: "a=shard_a:5432,b=shard_b:5432"
      AX_SHARD_DIRECTORY: /ax/directory.v1.json
      AX_DEMO_PASSWORD: ${AX_DEMO_PASSWORD:-demo1234}
      AX_ENABLE_DEMO_WRITES: "1"
      AX_TENANT_MAX_CONCURRENT: ${AX_TENANT_MAX_CONCURRENT:-4}   # B-3
      AX_TENANT_QUEUE_WAIT_S: ${AX_TENANT_QUEUE_WAIT_S:-0.25}
      # Login ON by default (tenant isolation demo). AX_AUTH_DISABLED=1 = open operator mode, local only.
      AX_AUTH_DISABLED: ${AX_AUTH_DISABLED:-0}
    volumes:
      - ./sharding/directory.v1.json:/ax/directory.v1.json:ro
      # B-4: directory mount (not a single file) so an edited/replaced metrics.json is picked up without restart.
      - ./app/config:/srv/config:ro
    ports: ["127.0.0.1:${AX_API_PORT:-8091}:8000"]
    networks:
      edge: { gw_priority: 10 }   # published port + default route never depend on a shard network
      net_a: {}
      net_b: {}
    mem_limit: 256m
    depends_on:
      shard_a: { condition: service_healthy }
      shard_b: { condition: service_healthy }

  writer:
    image: aggregatex-sharded:local
    pull_policy: never
    command: ["python", "-m", "axapi.writer"]
    environment:
      <<: *apienv
      AX_WRITER_RATE: ${AX_WRITER_RATE:-2}
    volumes:
      - ./sharding/directory.v1.json:/ax/directory.v1.json:ro
    networks:
      edge: { gw_priority: 10 }
      net_a: {}
      net_b: {}
    mem_limit: 128m
    depends_on:
      api: { condition: service_started }

networks:
  edge: {}
  net_a: {}
  net_b: {}

volumes:
  shard_a_data:
  shard_b_data:
